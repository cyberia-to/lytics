# ---
# tags: lytics, config
# crystal-type: source
# crystal-domain: cyber
# ---
[workspace]
resolver = "3"
members = ["event", "ingest", "agent", "core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Cyber"

[workspace.dependencies]
lytics-event = { path = "event" }
hemera = { package = "cyber-hemera", path = "../../hemera/rs" }
cybergraph = { path = "../../cybergraph" }
bbg = { path = "../../bbg/rs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# k256: sign only — drop precomputed tables (size), pkcs8/pem/serde/schnorr/ecdh
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "alloc"] }
# bip39: only linked via the `mnemonic` feature (import/export), never the core
bip39 = "2"
sha2 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
