# ---
# tags: lytics, config
# crystal-type: source
# crystal-domain: cyber
# ---
[workspace]
resolver = "3"
members = ["event", "ingest", "agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Cyber"

[workspace.dependencies]
lytics-event = { path = "event" }
hemera = { package = "cyber-hemera", path = "../../hemera/rs" }
cybergraph = { path = "../../cybergraph" }
bbg = { path = "../../bbg/rs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
bip32 = "0.5"
bip39 = { version = "2", features = ["rand"] }
sha2 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
base64 = "0.22"
hex = "0.4"
