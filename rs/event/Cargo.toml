# ---
# tags: lytics, config
# crystal-type: source
# crystal-domain: cyber
# ---
[package]
name = "lytics-event"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lytics event core — canonical encoding, hemera hash, pow, keys, adr-036 signing"

[features]
# both features are native conveniences the tracker wasm omits: `mnemonic`
# is the wordlist/PBKDF2 backup path, `json` is the serde_json canonicalizer
# (the hand-written encode_body is the real signing path). off in the core
# → neither the wordlist nor serde_json enters the wasm.
default = ["mnemonic", "json"]
mnemonic = ["dep:bip39"]
json = ["dep:serde_json"]

[dependencies]
hemera.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
k256.workspace = true
bip39 = { workspace = true, optional = true }
sha2.workspace = true
ripemd.workspace = true
bech32.workspace = true
base64.workspace = true
getrandom.workspace = true

[dev-dependencies]
hex.workspace = true
