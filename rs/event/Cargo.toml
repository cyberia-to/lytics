# ---
# tags: lytics, config
# crystal-type: source
# crystal-domain: cyber
# ---
[package]
name = "lytics-event"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lytics event core — canonical encoding, hemera hash, pow, keys, adr-036 signing"

[features]
# the 2048-word list + PBKDF2 path, needed only for import/export — off on
# the tracker signing path so the wordlist never enters the core wasm.
default = ["mnemonic"]
mnemonic = ["dep:bip39"]

[dependencies]
hemera.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
k256.workspace = true
bip32.workspace = true
bip39 = { workspace = true, optional = true }
sha2.workspace = true
ripemd.workspace = true
bech32.workspace = true
base64.workspace = true
getrandom.workspace = true

[dev-dependencies]
hex.workspace = true
