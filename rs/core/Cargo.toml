# ---
# tags: lytics, config
# crystal-type: source
# crystal-domain: cyber
# ---
[package]
name = "lytics-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lytics wasm tracker core — keys, sign, pow, attention sensor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features off → neither bip39/wordlist nor serde_json enter the wasm
lytics-event = { path = "../event", default-features = false }
wasm-bindgen = "=0.2.113"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# tests parse the wire JSON back — dev-only, never in the shipped cdylib
serde_json = "1"
lytics-event = { path = "../event" }
