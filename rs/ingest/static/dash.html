<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>lytics — cyberstates</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --cyber-black: #000000;
                --cyber-dark: #0a0a0a;
                --cyber-green: #00ff41;
                --cyber-cyan: #00e5ff;
                --cyber-magenta: #ff00ff;
                --cyber-yellow: #ffd700;
                --cyber-orange: #ff6600;
                --cyber-red: #ff0040;
                --cyber-dim: #1a1a1a;
                --cyber-muted: #333333;
                --cyber-text: #e0e0e0;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html {
                overflow-y: scroll;
                scrollbar-gutter: stable;
            }
            body {
                font-family: "Play", sans-serif;
                background: var(--cyber-black);
                color: var(--cyber-text);
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
            }
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: var(--cyber-black);
            }
            ::-webkit-scrollbar-thumb {
                background: var(--cyber-muted);
                border-radius: 3px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--cyber-green);
            }

            .page-frame {
                max-width: 1100px;
                margin: 0 auto;
                padding: 20px 24px 80px;
            }
            @media (max-width: 640px) {
                .page-frame {
                    padding: 12px 10px 72px;
                }
            }

            /* header */
            .header-row1 {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 8px;
                flex-wrap: wrap;
            }
            .logo {
                font-size: clamp(22px, 4vw, 36px);
                font-weight: 700;
                line-height: 1.1;
                color: #fff;
                text-decoration: none;
            }
            .logo span.mark {
                color: var(--cyber-green);
            }
            .logo-suffix {
                min-height: 14px;
                line-height: 14px;
                font-size: 11px;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: rgba(0, 255, 65, 0.55);
                margin-top: 4px;
            }
            .nav-row {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
            }
            .nav-btn {
                font-family: "Play", sans-serif;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 2px;
                color: #000;
                text-decoration: none;
                background: var(--btn-c);
                border: 1px solid var(--btn-c);
                padding: 8px 14px;
                border-radius: 2px;
                box-shadow: 0 0 14px
                    color-mix(in srgb, var(--btn-c) 35%, transparent);
                transition: all 0.15s;
                white-space: nowrap;
            }
            .nav-btn:hover {
                filter: brightness(1.1);
            }
            .nav-states {
                --btn-c: var(--cyber-green);
            }
            .nav-tokens {
                --btn-c: var(--cyber-yellow);
            }
            .nav-lytics {
                --btn-c: var(--cyber-cyan);
            }
            .nav-btn.nav-here {
                background: transparent;
                color: var(--btn-c);
                box-shadow: none;
            }

            .meta-line {
                font-size: 12px;
                letter-spacing: 1px;
                color: #555;
                margin: 8px 0 20px;
                line-height: 1.6;
            }
            .meta-line time {
                color: #777;
            }

            /* KPI cards — match .stat-grid / .stat-card */
            .section-label {
                font-size: 11px;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: #555;
                margin: 28px 0 12px;
            }
            .stat-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 12px;
            }
            .stat-card {
                background: #050505;
                border: 1px solid #1a1a1a;
                border-radius: 2px;
                padding: 14px 16px;
                min-width: 0;
            }
            .stat-label {
                font-size: 10px;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: #555;
                margin-bottom: 8px;
            }
            .stat-value {
                font-size: clamp(18px, 3vw, 26px);
                font-weight: 700;
                color: var(--cyber-green);
                font-variant-numeric: tabular-nums;
                line-height: 1.15;
            }
            .stat-value.cyan {
                color: var(--cyber-cyan);
            }
            .stat-value.yellow {
                color: var(--cyber-yellow);
            }
            .stat-value.orange {
                color: var(--cyber-orange);
            }
            .stat-value.magenta {
                color: var(--cyber-magenta);
            }
            .stat-hint {
                font-size: 11px;
                color: #444;
                margin-top: 6px;
                letter-spacing: 0.5px;
            }

            .hint {
                font-size: 12px;
                color: #3a3a3a;
                margin: 14px 0 0;
                letter-spacing: 0.5px;
                line-height: 1.5;
            }

            /* tables — match .cyber-table */
            .table-wrap {
                overflow-x: auto;
                margin-top: 4px;
                border: 1px solid #111;
                border-radius: 2px;
            }
            .cyber-table {
                width: 100%;
                border-collapse: separate;
                border-spacing: 0;
                font-size: 13px;
            }
            .cyber-table th {
                background: #050505;
                border-bottom: 1px solid var(--cyber-muted);
                padding: 12px 16px;
                text-align: left;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: var(--cyber-green);
                white-space: nowrap;
                user-select: none;
            }
            .cyber-table th.num,
            .cyber-table td.num {
                text-align: right;
                font-variant-numeric: tabular-nums;
            }
            .cyber-table td {
                border-bottom: 1px solid #111;
                padding: 10px 16px;
                color: #ccc;
            }
            .cyber-table tbody tr:hover td {
                background: #080808;
                color: #eee;
            }
            .cyber-table tbody tr:last-child td {
                border-bottom: none;
            }
            .cyber-table a {
                color: var(--cyber-cyan);
                text-decoration: none;
            }
            .cyber-table a:hover {
                color: var(--cyber-green);
            }
            .empty {
                color: #444;
                font-size: 13px;
                padding: 16px;
                letter-spacing: 1px;
            }

            .dock-credit {
                margin-top: 48px;
                font-size: 12px;
                color: #333;
                letter-spacing: 1px;
            }
            .dock-credit a {
                color: var(--cyber-green);
                text-decoration: none;
                opacity: 0.75;
            }
            .dock-credit a:hover {
                opacity: 1;
            }

            @media (max-width: 640px) {
                .stat-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
                .stat-value {
                    font-size: 18px;
                }
                .cyber-table th,
                .cyber-table td {
                    padding: 8px 10px;
                    font-size: 12px;
                }
                .nav-btn {
                    padding: 6px 10px;
                    font-size: 11px;
                    letter-spacing: 1px;
                }
            }
        </style>
    </head>
    <body>
        <div class="page-frame">
            <div class="header-row1">
                <div>
                    <a class="logo" href="/lytics/"
                        ><span class="mark">📈</span> LYTICS</a
                    >
                    <div class="logo-suffix" id="logo-suffix">
                        cyberstates · last 7 days
                    </div>
                </div>
                <div class="nav-row">
                    <a class="nav-btn nav-states" href="/">STATES</a>
                    <a class="nav-btn nav-tokens" href="/tokens">TOKENS</a>
                    <a class="nav-btn nav-lytics nav-here" href="/lytics/"
                        >LYTICS</a
                    >
                </div>
            </div>

            <div class="meta-line" id="meta">loading window…</div>

            <div class="section-label">overview</div>
            <div class="stat-grid" id="ov"></div>
            <p class="hint">
                visit = stream from one external entry to the next · depth =
                views/visit · dwell = attention/visit
            </p>

            <div class="section-label">visits by source</div>
            <div class="table-wrap">
                <table class="cyber-table" id="sources"></table>
            </div>

            <div class="section-label">visits by channel</div>
            <div class="table-wrap">
                <table class="cyber-table" id="channels"></table>
            </div>

            <div class="section-label">particles</div>
            <div class="table-wrap">
                <table class="cyber-table" id="particles"></table>
            </div>

            <div class="dock-credit">
                🏴 a <a href="https://cyberia.to">cyberia</a> project ·
                <a href="https://cyberstates.net">cyberstates.net</a>
            </div>
        </div>

        <script>
            const root = location.pathname.replace(/\/?$/, "/");
            const get = (name, extra = "") =>
                fetch(`${root}api/report/${name}${extra}`).then((r) =>
                    r.json(),
                );

            const fmt = (ms) => {
                if (ms == null || ms === 0) return "0s";
                if (ms >= 60000) return `${(ms / 60000).toFixed(1)}m`;
                if (ms >= 1000) return `${(ms / 1000).toFixed(1)}s`;
                return `${ms}ms`;
            };
            const fmtDepth = (milli) =>
                milli == null ? "—" : (milli / 1000).toFixed(2);
            const fmtDay = (ms) => {
                const d = new Date(ms);
                return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
            };
            const fmtStamp = (ms) =>
                new Date(ms)
                    .toISOString()
                    .replace("T", " ")
                    .replace(/\.\d{3}Z$/, " UTC");

            function table(el, headers, data, cols) {
                if (!data || !data.length) {
                    el.innerHTML = `<tbody><tr><td class="empty" colspan="${headers.length}">— no data in window</td></tr></tbody>`;
                    return;
                }
                el.innerHTML =
                    `<thead><tr>${headers
                        .map(
                            (h, i) =>
                                `<th class="${cols[i][1] || ""}">${h}</th>`,
                        )
                        .join("")}</tr></thead><tbody>` +
                    data
                        .map(
                            (r) =>
                                `<tr>${cols
                                    .map(
                                        ([c, cls]) =>
                                            `<td class="${cls || ""}">${r[c] ?? ""}</td>`,
                                    )
                                    .join("")}</tr>`,
                        )
                        .join("") +
                    `</tbody>`;
            }

            function cards(items) {
                return items
                    .map(
                        ([label, value, hint, klass]) =>
                            `<div class="stat-card">
          <div class="stat-label">${label}</div>
          <div class="stat-value ${klass || ""}">${value ?? "—"}</div>
          <div class="stat-hint">${hint}</div>
        </div>`,
                    )
                    .join("");
            }

            async function refresh() {
                const o = await get("overview");
                const from = o.from ?? Date.now() - 7 * 24 * 3600 * 1000;
                const to = o.to ?? Date.now();
                const asOf = o.as_of ?? Date.now();

                document.getElementById("meta").innerHTML =
                    `WINDOW <time datetime="${new Date(from).toISOString()}">${fmtDay(from)}</time>` +
                    ` → <time datetime="${new Date(to).toISOString()}">${fmtDay(to)}</time>` +
                    ` · UTC · AS OF <time datetime="${new Date(asOf).toISOString()}">${fmtStamp(asOf)}</time>`;

                document.getElementById("logo-suffix").textContent =
                    `cyberstates · ${fmtDay(from)} → ${fmtDay(to)}`;

                const depth = fmtDepth(o.views_per_visit_milli);
                const dwell = fmt(o.attention_ms_per_visit);
                const spv = o.single_page_visits ?? 0;
                const visits = o.visits ?? 0;
                const bounce =
                    visits > 0 ? `${Math.round((spv / visits) * 100)}%` : "—";

                document.getElementById("ov").innerHTML = cards([
                    ["NEURONS", o.neurons, "distinct keys", ""],
                    ["VIEWS", o.views, "pages seen", "cyan"],
                    ["VISITS", o.visits, "entries · no timeout", "yellow"],
                    ["DEPTH", depth, "views / visit", "orange"],
                    ["DWELL", dwell, "attention / visit", "magenta"],
                    ["1-PAGE", bounce, `${spv} single-page visits`, ""],
                    ["ATTENTION", fmt(o.attention_ms), "total looking", "cyan"],
                ]);

                const mapVisitRow = (r) => ({
                    name: r.source ?? r.channel ?? r.key,
                    visits: r.visits,
                    views: r.views,
                    depth: fmtDepth(r.views_per_visit_milli),
                    dwell: fmt(r.attention_ms_per_visit),
                    attention: fmt(r.attention_ms),
                });

                const visitCols = [
                    ["name", ""],
                    ["visits", "num"],
                    ["views", "num"],
                    ["depth", "num"],
                    ["dwell", "num"],
                    ["attention", "num"],
                ];

                table(
                    document.getElementById("sources"),
                    [
                        "SOURCE",
                        "VISITS",
                        "VIEWS",
                        "DEPTH",
                        "DWELL",
                        "ATTENTION",
                    ],
                    (await get("sources", "?limit=1000")).map(mapVisitRow),
                    visitCols,
                );
                table(
                    document.getElementById("channels"),
                    [
                        "CHANNEL",
                        "VISITS",
                        "VIEWS",
                        "DEPTH",
                        "DWELL",
                        "ATTENTION",
                    ],
                    (await get("channels")).map(mapVisitRow),
                    visitCols,
                );
                table(
                    document.getElementById("particles"),
                    ["PATH", "VIEWS", "ATTENTION"],
                    (await get("particles", "?limit=1000")).map((p) => ({
                        pathname: p.pathname,
                        views: p.views,
                        attention_ms: fmt(p.attention_ms),
                    })),
                    [
                        ["pathname", ""],
                        ["views", "num"],
                        ["attention_ms", "num"],
                    ],
                );
            }

            refresh();
            setInterval(refresh, 5000);
        </script>
    </body>
</html>
