<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>lytics</title>
        <style>
            body {
                font-family: ui-monospace, monospace;
                background: #000;
                color: #f0f0f0;
                max-width: 52rem;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            h1 {
                color: #22c55e;
                font-size: 1.4rem;
                margin-bottom: 0.25rem;
            }
            h2 {
                color: #06b6d4;
                font-size: 1rem;
                margin-top: 1.6rem;
            }
            h2 small {
                color: #555;
                font-weight: 400;
                margin-left: 0.5rem;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.85rem;
            }
            td,
            th {
                text-align: left;
                padding: 0.25rem 0.5rem;
                border-bottom: 1px solid #222;
            }
            th {
                color: #888;
            }
            td.num {
                text-align: right;
                font-variant-numeric: tabular-nums;
            }
            #ov {
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
            }
            #ov div {
                border: 1px solid #222;
                padding: 0.6rem 1rem;
                min-width: 5.5rem;
            }
            #ov b {
                display: block;
                font-size: 1.3rem;
                color: #22c55e;
            }
            #ov span.sub {
                display: block;
                font-size: 0.7rem;
                color: #555;
                margin-top: 0.15rem;
            }
            #meta {
                color: #666;
                font-size: 0.8rem;
                margin: 0.4rem 0 1rem;
                line-height: 1.5;
            }
            #meta time {
                color: #888;
            }
            small.tagline {
                color: #666;
            }
            .hint {
                color: #444;
                font-size: 0.75rem;
                margin-top: 0.35rem;
            }
        </style>
    </head>
    <body>
        <h1>📈 lytics</h1>
        <small class="tagline"
            >every visitor is a neuron — visits, not sessions</small
        >
        <div id="meta">loading window…</div>
        <div id="ov"></div>
        <p class="hint">
            visit = stream from one external entry to the next · depth =
            views/visit · dwell = attention/visit
        </p>

        <h2>visits by source <small>where attention came from</small></h2>
        <table id="sources"></table>

        <h2>visits by channel <small>direct · referral · social · …</small></h2>
        <table id="channels"></table>

        <h2>particles <small>pages</small></h2>
        <table id="particles"></table>

        <h2>actors</h2>
        <table id="actors"></table>

        <script>
            const root = location.pathname.replace(/\/?$/, "/");
            const get = (name, extra = "") =>
                fetch(`${root}api/report/${name}${extra}`).then((r) =>
                    r.json(),
                );

            const fmt = (ms) => {
                if (ms == null || ms === 0) return "0s";
                if (ms >= 60000) return `${(ms / 60000).toFixed(1)}m`;
                if (ms >= 1000) return `${(ms / 1000).toFixed(1)}s`;
                return `${ms}ms`;
            };

            const fmtDepth = (milli) =>
                milli == null ? "—" : (milli / 1000).toFixed(2);

            const fmtDay = (ms) => {
                const d = new Date(ms);
                return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
            };

            const fmtStamp = (ms) =>
                new Date(ms)
                    .toISOString()
                    .replace("T", " ")
                    .replace(/\.\d{3}Z$/, " UTC");

            function rows(el, header, data, cols) {
                el.innerHTML =
                    `<tr>${header.map((h) => `<th>${h}</th>`).join("")}</tr>` +
                    data
                        .map(
                            (r) =>
                                `<tr>${cols
                                    .map(
                                        ([c, cls]) =>
                                            `<td class="${cls || ""}">${r[c] ?? ""}</td>`,
                                    )
                                    .join("")}</tr>`,
                        )
                        .join("");
            }

            async function refresh() {
                const o = await get("overview");
                const from = o.from ?? Date.now() - 7 * 24 * 3600 * 1000;
                const to = o.to ?? Date.now();
                const asOf = o.as_of ?? Date.now();
                document.getElementById("meta").innerHTML =
                    `window <time datetime="${new Date(from).toISOString()}">${fmtDay(from)}</time>` +
                    ` → <time datetime="${new Date(to).toISOString()}">${fmtDay(to)}</time>` +
                    ` · UTC · as of <time datetime="${new Date(asOf).toISOString()}">${fmtStamp(asOf)}</time>`;

                const depth = fmtDepth(o.views_per_visit_milli);
                const dwell = fmt(o.attention_ms_per_visit);
                const spv = o.single_page_visits ?? 0;
                const visits = o.visits ?? 0;
                const bounce =
                    visits > 0 ? `${Math.round((spv / visits) * 100)}%` : "—";

                document.getElementById("ov").innerHTML = [
                    ["neurons", o.neurons, "distinct keys"],
                    ["views", o.views, "pages seen"],
                    ["visits", o.visits, "entries (no 30m timeout)"],
                    ["depth", depth, "views / visit"],
                    ["dwell", dwell, "attention / visit"],
                    ["1-page", bounce, `${spv} single-page visits`],
                    ["attention", fmt(o.attention_ms), "total looking"],
                    ["agents", o.agent_neurons, "declared agents"],
                ]
                    .map(
                        ([k, v, sub]) =>
                            `<div><b>${v ?? "—"}</b>${k}<span class="sub">${sub}</span></div>`,
                    )
                    .join("");

                const mapVisitRow = (r) => ({
                    name: r.source ?? r.channel ?? r.key,
                    visits: r.visits,
                    views: r.views,
                    depth: fmtDepth(r.views_per_visit_milli),
                    dwell: fmt(r.attention_ms_per_visit),
                    attention: fmt(r.attention_ms),
                });

                rows(
                    document.getElementById("sources"),
                    [
                        "source",
                        "visits",
                        "views",
                        "depth",
                        "dwell",
                        "attention",
                    ],
                    (await get("sources")).map(mapVisitRow),
                    [
                        ["name", ""],
                        ["visits", "num"],
                        ["views", "num"],
                        ["depth", "num"],
                        ["dwell", "num"],
                        ["attention", "num"],
                    ],
                );

                rows(
                    document.getElementById("channels"),
                    [
                        "channel",
                        "visits",
                        "views",
                        "depth",
                        "dwell",
                        "attention",
                    ],
                    (await get("channels")).map(mapVisitRow),
                    [
                        ["name", ""],
                        ["visits", "num"],
                        ["views", "num"],
                        ["depth", "num"],
                        ["dwell", "num"],
                        ["attention", "num"],
                    ],
                );

                rows(
                    document.getElementById("particles"),
                    ["path", "views", "attention"],
                    (await get("particles")).map((p) => ({
                        pathname: p.pathname,
                        views: p.views,
                        attention_ms: fmt(p.attention_ms),
                    })),
                    [
                        ["pathname", ""],
                        ["views", "num"],
                        ["attention_ms", "num"],
                    ],
                );

                const a = await get("actors");
                document.getElementById("actors").innerHTML =
                    `<tr><th>actor</th><th>neurons</th><th>views</th></tr>` +
                    `<tr><td>human</td><td class="num">${a.human.neurons}</td><td class="num">${a.human.views}</td></tr>` +
                    `<tr><td>agent</td><td class="num">${a.agent.neurons}</td><td class="num">${a.agent.views}</td></tr>` +
                    (a.agent.declared || [])
                        .map(
                            (d) =>
                                `<tr><td>· ${d.name}</td><td></td><td class="num">${d.views}</td></tr>`,
                        )
                        .join("");
            }

            refresh();
            setInterval(refresh, 5000);
        </script>
    </body>
</html>
