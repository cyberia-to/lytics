# ---
# tags: lytics, config
# crystal-type: source
# crystal-domain: cyber
# ---
[package]
name = "lytics-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lytics ingest — verify, enrich, cast into the cell, report"

[dependencies]
lytics-event.workspace = true
cybergraph.workspace = true
bbg.workspace = true
hemera.workspace = true
# the report engine: relations built from Vec<Stored> answered via real
# inf datalog (LocalSource), not a bbg-backed source — bbg's canonical
# dims carry no event fields (pathname/attention/referrer/actor)
inf-value  = { path = "../../../inf/rs/value" }
inf-source = { path = "../../../inf/rs/source" }
inf-parse  = { path = "../../../inf/rs/parse" }
inf-plan   = { path = "../../../inf/rs/plan" }
inf-eval   = { path = "../../../inf/rs/eval" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
base64.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chacha20poly1305 = "0.10"
woothee = "0.13"
maxminddb = "0.24"

[dev-dependencies]
lytics-event.workspace = true
